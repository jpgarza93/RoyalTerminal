name: Proof full unit suite (temporary)
on:
  push:
    branches: [proof/native-targets-full]
jobs:
  pwsh-resize:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [fed08f0fb344ecc6086d9163de52b00b92899ccb, ad857e6fa8323c1cee5b0724893b37eb02fb5bb2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build tests
        run: dotnet build tests/RoyalTerminal.Tests/RoyalTerminal.Tests.csproj -c Release
      - name: Run the three PowerShell resize tests alone
        shell: bash
        run: >
          dotnet tests/RoyalTerminal.Tests/bin/Release/net10.0/RoyalTerminal.Tests.dll
          -method RoyalTerminal.Tests.TerminalControlTests.Control_WindowsPtyManagedRealPwshResize_PreservesPowerShellTableAndCursor
          -method RoyalTerminal.Tests.TerminalControlTests.Control_WindowsPtyManagedRapidRealPwshResize_PreservesDeterministicPowerShellTableRows
          -method RoyalTerminal.Tests.PtyContractTests.WindowsPty_PwshManagedProcessorResize_PreservesPowerShellTableAfterConptyResize
